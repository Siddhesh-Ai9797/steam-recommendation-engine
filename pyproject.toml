[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-rec"
version = "1.0.0"
description = "Multimodal Steam games recommender: GNN candidates, NLP and CLIP fusion, FAISS serving"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "faiss-cpu>=1.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy<2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7", "transformers>=4.40", "pillow", "requests"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
